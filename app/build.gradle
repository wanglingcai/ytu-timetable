import java.util.Properties

plugins { id 'com.android.application' }

def signingPropertiesFile = rootProject.file('keystore.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'cn.ytu.timetable'
    compileSdk 36
    defaultConfig {
        applicationId 'cn.ytu.timetable.personal'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '0.9.6'
        testInstrumentationRunner 'cn.ytu.timetable.SmokeInstrumentation'
    }
    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        androidTest.assets.srcDir "$rootDir/tests/fixtures"
    }
}

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
}
