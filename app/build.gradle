plugins { id 'com.android.application' }

android {
    namespace 'cn.ytu.timetable'
    compileSdk 36
    defaultConfig {
        applicationId 'cn.ytu.timetable.personal'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.2.2'
        testInstrumentationRunner 'cn.ytu.timetable.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
